  <rect class="th-deep" x="13.5" y="24.5" width="13" height="6" rx="1.5"/>
  <rect class="th-soft" x="15" y="26" width="2" height="3"/>
  <rect class="th-soft" x="19" y="26" width="2" height="3"/>
  <rect class="th-soft" x="23" y="26" width="2" height="3"/>
</svg>
